name: Validate Control4 drivers
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Lua runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.4 luajit
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - name: Build drivers
        run: |
          python tools/build_switch.py
          python tools/build_light.py
